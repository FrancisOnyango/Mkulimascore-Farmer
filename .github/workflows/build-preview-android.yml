name: Mkulima-staging-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_APP_MODE: staging
      EXPO_PUBLIC_ENVIRONMENT: staging
      EXPO_PUBLIC_API_BASE_URL: https://v27oclbqdpqr576iubuqxdumpy0qlviw.lambda-url.us-east-1.on.aws
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          accept-android-sdk-licenses: true
          packages: "tools platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Disable Android lint
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          text = p.read_text()
          if "checkReleaseBuilds false" not in text:
              text = text.replace(
                  "android {",
                  "android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }",
                  1,
              )
              p.write_text(text)
          PY

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          printf '\nreactNativeArchitectures=arm64-v8a\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\nandroid.lint.checkReleaseBuilds=false\n' >> gradle.properties
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mkulima-staging-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
